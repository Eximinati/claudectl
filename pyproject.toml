[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claudectl"
version = "1.6.0"
description = "The workspace layer for Claude Code - persistent project memory, an interactive architecture graph, MCP awareness, and per-project launch control in a fast terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Babar Muhammad Anas" }]
keywords = ["claude", "claude-code", "tui", "session-manager", "windows"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/babarmuhammad/claudectl"
Issues = "https://github.com/babarmuhammad/claudectl/issues"

[project.scripts]
claudectl = "claude_sessions.main:run"

[tool.setuptools]
packages = ["claude_sessions"]

[tool.setuptools.package-data]
# The GUI is served from source files, not generated — they have to ship.
# web/vendor/** is three.js + anime.js (both MIT, vendored so the GUI stays
# offline); the nested globs are needed because package-data does not recurse.
claude_sessions = [
    "web/*.html", "web/*.css", "web/*.js",
    "web/vendor/*.js", "web/vendor/*.txt",
    "web/vendor/*/*.js",
    "skills_templates/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
